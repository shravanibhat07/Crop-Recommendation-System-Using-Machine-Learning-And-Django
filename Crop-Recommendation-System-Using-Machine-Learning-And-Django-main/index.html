<!DOCTYPE html>
<html>
<head>

    <title>Crop Recommendation System</title>

    <style>

        body{
            font-family: Arial;
            background-color:#f2f2f2;
            text-align:center;
            padding-top:30px;
        }

        .container{
            width:45%;
            background:white;
            margin:auto;
            padding:30px;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
        }

        input{
            width:90%;
            padding:10px;
            margin:10px;
            border-radius:5px;
            border:1px solid gray;
        }

        button{
            background:green;
            color:white;
            padding:10px 20px;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:darkgreen;
        }

        h1{
            color:green;
        }

        table{
            margin:auto;
            margin-top:20px;
            border-collapse:collapse;
            width:80%;
        }

        table, th, td{
            border:1px solid black;
            padding:10px;
        }

        th{
            background:green;
            color:white;
        }

        h2{
            color:blue;
        }

    </style>

</head>

<body>

<div class="container">

<h1>Crop Recommendation System</h1>

<form method="POST">

    {% csrf_token %}

    <input type="number" name="N" placeholder="Nitrogen Value" required>

    <input type="number" name="P" placeholder="Phosphorus Value" required>

    <input type="number" name="K" placeholder="Potassium Value" required>

    <input type="text" name="temperature" placeholder="Temperature" required>

    <input type="text" name="humidity" placeholder="Humidity" required>

    <input type="text" name="ph" placeholder="pH Value" required>

    <input type="text" name="rainfall" placeholder="Rainfall" required>

    <button type="submit">Predict Crop</button>

</form>


<h2>Recommended Crop: {{ result }}</h2>

<h2>Best Algorithm: {{ best_algorithm }}</h2>









</div>

</body>
</html>
